<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Number Guessing Game</title>
  <style>
    body { font-family: system-ui, Arial; padding: 24px; max-width:700px; margin:auto; }
    .card { border:1px solid #ddd; padding:18px; border-radius:8px; box-shadow: 0 2px 6px rgba(0,0,0,0.04);}
    label, button { display:block; margin-top:10px; }
    input[type="number"] { padding:8px; width:120px; }
    .log { margin-top:12px; font-size:0.95rem; color:#333; }
  </style>
</head>
<body>
  <h1>Number Guessing Game</h1>
  <div class="card">
    <p>I'm thinking of a number between <strong>1</strong> and <strong>100</strong>. Try to guess it!</p>

    <label>
      Your guess:
      <input id="guessInput" type="number" min="1" max="100" />
    </label>

    <button id="guessBtn">Guess</button>
    <button id="newGameBtn" style="margin-left:8px">New Game</button>

    <p id="feedback" class="log"></p>
    <p id="history" class="log"></p>
  </div>

  <script>
    // --- Game state variables ---
    let targetNumber;
    let attempts;
    let maxAttempts = null; // set to a number to enforce a limit, or null for unlimited
    let guessHistory = [];

    // Helper: generate integer between min and max inclusive
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Initialize / reset the game
    function newGame() {
      targetNumber = randomInt(1, 100);
      attempts = 0;
      guessHistory = [];
      document.getElementById('feedback').textContent = 'Game started — make a guess!';
      document.getElementById('history').textContent = '';
      document.getElementById('guessInput').value = '';
      document.getElementById('guessInput').focus();
      console.log('DEBUG - targetNumber =', targetNumber); // remove in production if you don't want the number visible in console
    }

    // Process one guess
    function processGuess() {
      const input = document.getElementById('guessInput').value;
      const feedbackEl = document.getElementById('feedback');
      const historyEl = document.getElementById('history');

      if (input === '') {
        alert('Please enter a number between 1 and 100.');
        return;
      }

      const guess = Number(input);

      // Validate
      if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
        alert('Enter a whole number from 1 to 100.');
        return;
      }

      attempts++;
      guessHistory.push(guess);

      // Check attempt limit (if set)
      if (maxAttempts !== null && attempts > maxAttempts) {
        feedbackEl.textContent = `Out of attempts! The number was ${targetNumber}.`;
        historyEl.textContent = `Your guesses: ${guessHistory.join(', ')}.`;
        return;
      }

      // Compare
      if (guess === targetNumber) {
        feedbackEl.textContent = `Correct! 🎉 You guessed it in ${attempts} attempt${attempts===1 ? '' : 's'}.`;
        historyEl.textContent = `Your guesses: ${guessHistory.join(', ')}.`;
      } else if (guess < targetNumber) {
        feedbackEl.textContent = `Too low — try a higher number. Attempts: ${attempts}.`;
        historyEl.textContent = `Guesses so far: ${guessHistory.join(', ')}.`;
      } else {
        feedbackEl.textContent = `Too high — try a lower number. Attempts: ${attempts}.`;
        historyEl.textContent = `Guesses so far: ${guessHistory.join(', ')}.`;
      }

      document.getElementById('guessInput').value = '';
      document.getElementById('guessInput').focus();
    }

    // Event handlers
    document.getElementById('guessBtn').addEventListener('click', processGuess);
    document.getElementById('newGameBtn').addEventListener('click', newGame);
    // Allow Enter to submit
    document.getElementById('guessInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') processGuess();
    });

    // Start first game
    newGame();
  </script>
</body>
</html>
